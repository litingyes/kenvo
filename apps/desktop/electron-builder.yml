appId: app.vercel.kenvo
productName: Kenvo
copyright: Copyright © 2026 Kenvo
publish:
  provider: github
  owner: litingyes
  repo: kenvo
directories:
  output: release
  buildResources: build
files:
  - dist
  - dist-electron
  - resources
asarUnpack:
  - '**/node_modules/node-pty/**'
extraResources:
  - from: ../../packages/agent-server/dist
    to: agent-server
    filter:
      - '**/*'
  - from: ../../packages/agent-server/node_modules/better-sqlite3/build/Release/better_sqlite3.node
    to: agent-server/better_sqlite3.node
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  identity: '-'
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
win:
  target:
    - nsis
linux:
  target:
    - AppImage
    - deb
